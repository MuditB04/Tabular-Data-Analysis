[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabular-data-analysis-agent"
version = "0.1.0"
description = "Production-minded, router-driven agent for natural language tabular data analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Principal AI Engineer", email = "engineering@tabular-agent.local"}
]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "plotly>=5.17.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
]
llm = [
    "litellm>=1.0.0",
    "openai>=1.2.0",
]
test = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[project.scripts]
tda-agent = "src.agent.service:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
